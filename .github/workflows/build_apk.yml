name: NEON PRO - Build Android APK & Windows EXE
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: neon-pro-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Signed Installable Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Buildozer Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip patch ant lbzip2 xz-utils openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake ccache lld libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
      - name: Cache Buildozer
        uses: actions/cache@v6
        with:
          path: |
            .buildozer
            ~/.buildozer
            ~/.gradle/caches
          key: ubuntu22-v4-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ubuntu22-v4-buildozer-
      - name: Build APK
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "setuptools<66.0.0" wheel virtualenv cython==0.29.36 buildozer
          yes | buildozer -v android debug
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: NeonMobile-Android-APK
          path: bin/*.apk
          if-no-files-found: error

  build_exe:
    name: Build Windows Standalone EXE
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PIP_NO_INPUT: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      KIVY_NO_ARGS: '1'
      KIVY_NO_CONSOLELOG: '1'
      KIVY_NO_FILELOG: '1'
      KIVY_NO_CONFIG: '1'
      KIVY_LOG_MODE: 'PYTHON'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Speed Up Windows Build
        shell: pwsh
        run: |
          try { Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue } catch {}
          try { Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:LOCALAPPDATA, $env:TEMP, "C:\hostedtoolcache" -ErrorAction SilentlyContinue } catch {}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Windows Build Deps
        shell: pwsh
        run: |
          python -m venv .venv_win
          .\.venv_win\Scripts\python.exe -m pip install --upgrade pip
          .\.venv_win\Scripts\python.exe -m pip install --prefer-binary --no-input "kivy==2.3.2" requests certifi urllib3 pyinstaller
          .\.venv_win\Scripts\python.exe -c "import kivy, PyInstaller; print(kivy.__version__, PyInstaller.__version__)"
      - name: Compile Standalone Windows EXE
        timeout-minutes: 8
        shell: pwsh
        env:
          SDL_VIDEODRIVER: 'dummy'
          SDL_AUDIODRIVER: 'dummy'
        run: |
          .\.venv_win\Scripts\pyinstaller.exe --clean --noconfirm --noconsole --onefile --noupx --log-level=INFO --collect-data certifi --exclude-module tkinter --exclude-module unittest --exclude-module test --exclude-module pydoc --exclude-module doctest --exclude-module lib2to3 --exclude-module kivy.tests --exclude-module docutils --exclude-module pygments --exclude-module numpy --exclude-module scipy --exclude-module matplotlib --exclude-module PIL --exclude-module cv2 --exclude-module enchant --exclude-module twisted --exclude-module pygame --name "NeonMobile_Windows" main.py
      - name: Verify Windows EXE Output
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v7
        with:
          name: NeonMobile-Windows-EXE
          path: dist/*.exe
          if-no-files-found: error
